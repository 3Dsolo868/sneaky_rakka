<script>
"use strict";
/* =========================================================================
   SNEAKY RAGNHEIÐUR
   A two-hero rescue platformer. Built as a single, dependency-free page.
   ========================================================================= */

// ---------- Canvas setup ----------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const endVideoEl = document.getElementById('endVideo');
const endVideoSkipHint = document.getElementById('endVideoSkipHint');
// W/H are the LOGICAL coordinate space every drawing call in this file uses —
// unchanged regardless of how large the canvas actually renders on screen.
// fitCanvasToDisplay() below matches the canvas's real pixel buffer to its
// displayed CSS size (× devicePixelRatio) so the game stays crisp at any
// window size instead of being stretched from a fixed small buffer.
const W = 960, H = 540;
function fitCanvasToDisplay(){
  const rect = canvas.getBoundingClientRect();
  if(rect.width < 1 || rect.height < 1) return; // not laid out yet
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const targetW = Math.round(rect.width * dpr);
  const targetH = Math.round(rect.height * dpr);
  if(canvas.width !== targetW || canvas.height !== targetH){
    canvas.width = targetW;
    canvas.height = targetH;
  }
  const scale = targetW / W;
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
}
fitCanvasToDisplay();
window.addEventListener('resize', fitCanvasToDisplay);
requestAnimationFrame(fitCanvasToDisplay); // safety re-check once layout has fully settled

// ---------- Utility ----------
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
function rectOf(o){ return { x:o.x, y:o.y, w:o.w, h:o.h }; }
function overlap(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function seededRand(seed){
  const x = Math.sin(seed * 999.7 + 13.1) * 10000;
  return x - Math.floor(x);
}
function lerp(a,b,t){ return a + (b-a)*t; }
function easeOutQuad(t){ return t*(2-t); }
function easeInQuad(t){ return t*t; }

// ---------- Assets ----------
const IMG = {

// All four face right by default, matching the game's facing convention.

// ---------- Audio (tiny synth, no files needed) ----------
let actx = null;
let muted = false;
function ensureAudio(){
  if(actx) return;
  try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }
  catch(e){ actx = null; }
}
function beep(freq, dur, type, vol, slideTo){
  if(muted || !actx) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type || 'square';
  const t0 = actx.currentTime;
  o.frequency.setValueAtTime(freq, t0);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(slideTo,1), t0 + dur);
  g.gain.setValueAtTime(vol != null ? vol : 0.07, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
// Like beep(), but scheduled at an explicit future AudioContext time instead
// of "now" — used by the music sequencer so notes line up precisely without
// drifting, and given a short attack ramp so notes don't click.
function tone(freq, startTime, dur, type, vol){
  if(muted || !actx) return;
  const o = actx.createOscillator();
  const g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, startTime);
  g.gain.setValueAtTime(0.0001, startTime);
  g.gain.exponentialRampToValueAtTime(vol, startTime + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, startTime + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(startTime); o.stop(startTime + dur + 0.03);
}
const sfx = {
  jump:      () => beep(520, 0.12, 'square', 0.06, 760),
  shoot:     () => beep(880, 0.06, 'square', 0.045, 300),
  enemyShoot:() => beep(300, 0.07, 'sawtooth', 0.035, 180),
  hitEnemy:  () => beep(180, 0.12, 'sawtooth', 0.07, 60),
  stomp:     () => beep(300, 0.10, 'square', 0.07, 120),
  hurt:      () => beep(140, 0.22, 'sawtooth', 0.09, 40),
  gem:       () => beep(1000, 0.08, 'sine', 0.05, 1400),
  heart:     () => beep(700, 0.16, 'sine', 0.06, 1000),
  oneUp:     () => { beep(660,0.1,'square',0.06,900); setTimeout(()=>beep(990,0.15,'square',0.06,1300),90); },
  checkpoint:() => beep(500, 0.25, 'triangle', 0.07, 900),
  select:    () => beep(440, 0.06, 'square', 0.05, 620),
  confirm:   () => beep(660, 0.1, 'square', 0.06, 880),
  win:       () => { beep(660,0.15,'square',0.07,880); setTimeout(()=>beep(880,0.2,'square',0.07,1100),120); setTimeout(()=>beep(1100,0.28,'square',0.07,1400),260); },
  lose:      () => beep(220, 0.45, 'sawtooth', 0.08, 70),
  bossHit:   () => beep(220, 0.09, 'square', 0.06, 140),
  bossDefeat:() => { beep(880,0.12,'square',0.08,1200); setTimeout(()=>beep(660,0.12,'square',0.08,880),100); setTimeout(()=>beep(1320,0.35,'square',0.09,1760),200); },
  villainAppear: () => beep(160, 0.5, 'sawtooth', 0.06, 60),
  struggle:      () => beep(320, 0.08, 'square', 0.06, 200),
  dragOff:       () => beep(500, 0.4, 'sawtooth', 0.06, 90),
  reunite:       () => { beep(520,0.14,'sine',0.07,780); setTimeout(()=>beep(780,0.18,'sine',0.07,1040),110); setTimeout(()=>beep(1040,0.3,'sine',0.08,1300),240); },
  heartShower:   () => { beep(660,0.1,'sine',0.06,880); setTimeout(()=>beep(880,0.1,'sine',0.06,1100),80); setTimeout(()=>beep(1100,0.1,'sine',0.06,1320),160); setTimeout(()=>beep(1320,0.22,'sine',0.07,1600),240); },
};

// ---------- Background music (simple looping chiptune, no audio files) ----------
// A short pentatonic melody + a two-note bass drone, scheduled just ahead of
// playback time (the standard Web Audio lookahead pattern) so it loops
// smoothly without drifting or stuttering. The title screen gets its own
// original, brighter tune (not based on any existing song) instead of the
// regular gameplay loop.
const NOTE_C4 = 261.63;
function noteFreq(semitones){ return NOTE_C4 * Math.pow(2, semitones / 12); }
function beatDur(bpm){ return 60 / bpm; }
const MUSIC_BPM = 108;
// C major pentatonic riff (semitones from C4), two bars, 16 eighth notes:
const MELODY = [0,4,7,4, 9,7,4,2, 0,4,7,9, 12,9,7,4];
// Simple root/fifth drone underneath, one note per quarter (8 per loop):
const BASS = [-12,-5,-12,-5, -12,-5,-8,-5];
// Title-screen theme: brighter, faster, original celebratory contour.
const TITLE_BPM = 132;
const TITLE_MELODY = [0,4,7,12, 9,7,4,0, 2,5,9,12, 11,9,7,4];
const TITLE_BASS = [-12,-12,-5,-5, -12,-12,-8,-8];
const music = { noteIdx:0, nextTime:0, bassIdx:0, bassNextTime:0, inited:false };
function scheduleMusic(){
  if(muted || !actx) return;
  const onTitle = (state === 'title');
  const bpm = onTitle ? TITLE_BPM : MUSIC_BPM;
  const eighth = beatDur(bpm) / 2, quarter = beatDur(bpm);
  const melody = onTitle ? TITLE_MELODY : MELODY;
  const bass = onTitle ? TITLE_BASS : BASS;
  const now = actx.currentTime;
  if(!music.inited || music.nextTime < now){ music.nextTime = now + 0.05; music.inited = true; }
  if(music.bassNextTime < now) music.bassNextTime = now + 0.05;
  while(music.nextTime < now + 0.12){
    tone(noteFreq(melody[music.noteIdx % melody.length]), music.nextTime, eighth * 0.85, 'triangle', 0.045);
    music.noteIdx++;
    music.nextTime += eighth;
  }
  while(music.bassNextTime < now + 0.12){
    tone(noteFreq(bass[music.bassIdx % bass.length]), music.bassNextTime, quarter * 0.9, 'sine', 0.05);
    music.bassIdx++;
    music.bassNextTime += quarter;
  }
}

// ---------- Input ----------
const keys = {};
const KEYS_CAPTURED = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','KeyR','KeyX','KeyJ','KeyI','KeyV','KeyH','KeyP','KeyN','KeyL','Enter','Escape','KeyM'];
// Named so touch controls can call the exact same code path as a real
// keyboard event — one input pipeline, two ways to trigger it.
let heartComboActive = false;
let godComboActive = false;
let healComboActive = false;
let skipComboActive = false;
let godMode = false;
function handleKeyDown(e){
  ensureAudio();
  if(KEYS_CAPTURED.includes(e.code)) e.preventDefault();
  keys.__justPressed = keys.__justPressed || {};
  if(!keys[e.code]) keys.__justPressed[e.code] = true;
  keys[e.code] = true;
  if(e.code === 'KeyM') toggleMute();
  if(keys['KeyR'] && keys['KeyS'] && !heartComboActive){
    heartComboActive = true;
    spawnHeartShower();
  }
  // Secret cheats — I+V toggles invincibility, H+P fully heals, N+L skips
  // to the next level. All harmless if triggered outside gameplay.
  if(keys['KeyI'] && keys['KeyV'] && !godComboActive){
    godComboActive = true;
    godMode = !godMode;
    sfx.confirm();
  }
  if(keys['KeyH'] && keys['KeyP'] && !healComboActive){
    healComboActive = true;
    if(state === 'playing' && hearts < maxHearts){
      hearts = maxHearts;
      sfx.heart();
      spawnSpark(player.x + player.w/2, player.y + player.h/2, '#ff6b81');
    }
  }
  if(keys['KeyN'] && keys['KeyL'] && !skipComboActive){
    skipComboActive = true;
    if(state === 'playing'){
      if(level.isFinal){ state = 'rescue'; stateTimer = 0; camera.x = 0; sfx.win(); }
      else { state = 'levelClear'; stateTimer = 0; sfx.confirm(); }
    }
  }
}
function handleKeyUp(e){
  keys[e.code] = false;
  if(e.code === 'KeyR' || e.code === 'KeyS') heartComboActive = false;
  if(e.code === 'KeyI' || e.code === 'KeyV') godComboActive = false;
  if(e.code === 'KeyH' || e.code === 'KeyP') healComboActive = false;
  if(e.code === 'KeyN' || e.code === 'KeyL') skipComboActive = false;
}
window.addEventListener('keydown', handleKeyDown);
window.addEventListener('keyup', handleKeyUp);
function justPressed(code){
  if(keys.__justPressed && keys.__justPressed[code]){ keys.__justPressed[code] = false; return true; }
  return false;
}
function clearJustPressed(){ keys.__justPressed = {}; }
function tapCode(code){ handleKeyDown({ code, preventDefault(){} }); handleKeyUp({ code }); }

const muteBtn = document.getElementById('muteBtn');
function toggleMute(){ muted = !muted; muteBtn.textContent = muted ? '🔇' : '🔊'; }
muteBtn.addEventListener('click', ()=>{ ensureAudio(); toggleMute(); });

// ---------- Touch controls (mobile) ----------
// These call the same handleKeyDown/handleKeyUp as the keyboard, so gameplay
// logic never needs to know which input source is in use. The buttons are
// hidden by CSS on precise-pointer (mouse) devices, so desktop is unaffected.
function bindHoldButton(id, code){
  const el = document.getElementById(id);
  if(!el) return;
  const press = (e) => { e.preventDefault(); ensureAudio(); handleKeyDown({ code, preventDefault(){} }); };
  const release = (e) => { if(e) e.preventDefault(); handleKeyUp({ code }); };
  el.addEventListener('touchstart', press, { passive:false });
  el.addEventListener('touchend', release, { passive:false });
  el.addEventListener('touchcancel', release, { passive:false });
  // Also respond to mouse events so it's testable on touch-emulated desktop browsers.
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', release);
  el.addEventListener('mouseleave', release);
}
function bindTapButton(id, code){
  const el = document.getElementById(id);
  if(!el) return;
  const tap = (e) => { e.preventDefault(); ensureAudio(); tapCode(code); };
  el.addEventListener('touchstart', tap, { passive:false });
  el.addEventListener('click', tap);
}
bindHoldButton('btnLeft', 'ArrowLeft');
bindHoldButton('btnRight', 'ArrowRight');
bindHoldButton('btnJump', 'ArrowUp');
bindHoldButton('btnShoot', 'KeyX');
bindTapButton('btnPause', 'Escape');
// Tapping the game view itself confirms menus (title, story, level-clear,
// rescue, win, game-over) — the same role Enter plays on keyboard. It has no
// effect during actual gameplay since those screens don't read Enter.
canvas.addEventListener('touchstart', (e) => { e.preventDefault(); ensureAudio(); tapCode('Enter'); }, { passive:false });
canvas.addEventListener('click', () => { ensureAudio(); tapCode('Enter'); });

// Fade out the rotate-phone tip after a few seconds; purely cosmetic and

const rotateHint = document.getElementById('rotateHint');
if(rotateHint){
  setTimeout(() => { rotateHint.style.transition = 'opacity 1s'; rotateHint.style.opacity = '0'; }, 4000);
}

// ---------- Physics constants ----------

// ---------- Character palettes ----------

// Ragga Muffin's fight-time taunts — a private joke, since he's

const THEMES = {
  fjord: {
    sky1:'#bfe3ef', sky2:'#eaf6f2', far:'#9cc9d6', near:'#6fa8b8',
    ground:'#e8f2f4', groundDk:'#b9d3d9', groundLine:'#dff0f2',

  },
  savanna: {

    ground:'#c99a4f', groundDk:'#a97a35', groundLine:'#e0b86e',

  },
  volcanic: {
    sky1:'#2b1420', sky2:'#5c2233', far:'#3a1b28', near:'#241119',

    platform:'#4a4448', platformDk:'#2a262a',

// ---------- Level builder ----------
// Ground pattern: string of 'G' (solid) and '.' (gap), each char = one TILE wide.
function groundRectsFromPattern(pattern){
  const rects = [];
  let start = null;
  for(let i = 0; i <= pattern.length; i++){
    const c = pattern[i];
    if(c === 'G'){
      if(start === null) start = i;
    } else if(start !== null){
      rects.push({ x:start*TILE, y:GROUND_Y, w:(i-start)*TILE, h:GROUND_DEPTH, kind:'ground' });
      start = null;
    }
  }
  return rects;
}
function plat(x, y, w){ return { x, y, w, h:18, kind:'platform' }; }

function buildLevel(def){
  const groundRects = groundRectsFromPattern(def.pattern);
  const width = def.pattern.length * TILE;
  const platforms = (def.platforms || []).map(p => plat(p[0], p[1], p[2]));
  const solids = groundRects.concat(platforms);

  const enemies = (def.enemies || []).map((e, i) => makeEnemy(e, i));
  const pickups = (def.pickups || []).map(p => ({
    x:p[1], y:p[2], w: p[0]==='gem'?18:(p[0]==='heart'?22:26), h: p[0]==='gem'?18:(p[0]==='heart'?20:26),
    type:p[0], collected:false
  }));

  const level = {
    name: def.name,
    theme: def.theme,
    quip: def.quip || '',
    width, solids, groundRects, platforms,
    enemies, pickups,
    checkpoint: { x: def.start[0], y: def.start[1] },
    start: { x: def.start[0], y: def.start[1] },
    goalX: def.goalX,
    isFinal: !!def.isFinal,
    hasBoss: !!def.hasBoss,
    bossDefeated: false,
    barrier: def.barrier ? { x:def.barrier[0], y:def.barrier[1]-260, w:14, h:260, kind:'barrier' } : null,
    decor: def.decor || [],
    bgSeed: def.bgSeed || 1
  };
  return level;
}

function makeEnemy(e, idx){
  // e: [type, x, y, ...extra]
  const base = { type:e[0], x:e[1], y:e[2], vx:0, vy:0, dead:false, hp:1, hurtT:0 };
  if(e[0] === 'walker'){
    return Object.assign(base, {
      w:32, h:44, y:e[2]-44, patrolMin:e[3], patrolMax:e[4], vx: e[5] || -1.5,
      stompable:true, hp:1, animT: Math.random()*10,
      creature: (idx % 2 === 0) ? 'ant' : 'grasshopper'
    });
  }
  if(e[0] === 'shooter'){
    return Object.assign(base, {
      w:30, h:34, y:e[2]-34, timer: e[3]||60, fireRate: e[3]||70,
      stompable:false, hp:2, creature:'bee'
    });
  }
  if(e[0] === 'flyer'){
    return Object.assign(base, {
      w:30, h:26, baseY:e[2], y:e[2], patrolMin:e[3], patrolMax:e[4], vx: e[5]||1.6,
      t: Math.random()*6, stompable:false, hp:1, creature:'mosquito'
    });
  }
  if(e[0] === 'boss'){
    return Object.assign(base, {
      w:64, h:60, baseX:e[1], baseY:e[2], y:e[2],
      mode:'hover', timer:90, t:0, stompable:false, hp:8, maxHp:8,
      tauntText:'', tauntTimer:0
    });
  }
  return base;
}

// Every level is doubled in length by replaying its own (already
// gap-tested) layout a second time, joined by a short solid connector run —
// this guarantees the extended stretch is exactly as safe as the original
// rather than hand-designing new layouts from scratch. The one level with a
// boss keeps a single boss encounter: only the corridor before the barrier
// gets duplicated, and the arena+boss section is appended once more at the
// new, later position.
function extendLevel(def){
  const CONNECTOR_TILES = 6;
  const connector = 'G'.repeat(CONNECTOR_TILES);
  const connectorWidth = CONNECTOR_TILES * TILE;

  const splitTile = def.barrier ? Math.floor(def.barrier[0] / TILE) : null;
  const basePattern = splitTile != null ? def.pattern.slice(0, splitTile) : def.pattern;
  const tailPattern = splitTile != null ? def.pattern.slice(splitTile) : '';
  const baseWidth = basePattern.length * TILE;
  const dupShift = baseWidth + connectorWidth;         // shift for the duplicated base copy
  const tailItemShift = baseWidth + connectorWidth * 2; // shift for the arena/boss tail, if any

  const newPattern = tailPattern
    ? basePattern + connector + basePattern + connector + tailPattern
    : basePattern + connector + basePattern;

  function inBase(x){ return splitTile == null || x < baseWidth; }
  function shiftPlatform(p){ return [p[0] + (inBase(p[0]) ? dupShift : tailItemShift), p[1], p[2]]; }
  function shiftPickup(p){ return [p[0], p[1] + (inBase(p[1]) ? dupShift : tailItemShift), p[2]]; }
  function shiftEnemy(e){
    const shift = inBase(e[1]) ? dupShift : tailItemShift;
    const copy = e.slice();
    copy[1] += shift;
    if((copy[0] === 'walker' || copy[0] === 'flyer') && copy[3] != null){
      copy[3] += shift; copy[4] += shift;
    }
    return copy;
  }

  const baseEnemies = (def.enemies || []).filter(e => inBase(e[1]));
  const basePickups = (def.pickups || []).filter(p => inBase(p[1]));
  const basePlatforms = (def.platforms || []).filter(p => inBase(p[0]));
  const tailEnemies = (def.enemies || []).filter(e => !inBase(e[1]));
  const tailPickups = (def.pickups || []).filter(p => !inBase(p[1]));
  const tailPlatforms = (def.platforms || []).filter(p => !inBase(p[0]));

  const newDef = Object.assign({}, def, {
    pattern: newPattern,
    platforms: basePlatforms.concat(basePlatforms.map(shiftPlatform), tailPlatforms.map(shiftPlatform)),
    enemies: baseEnemies.concat(baseEnemies.map(shiftEnemy), tailEnemies.map(shiftEnemy)),
    pickups: basePickups.concat(basePickups.map(shiftPickup), tailPickups.map(shiftPickup)),
    goalX: def.goalX + (inBase(def.goalX) ? dupShift : tailItemShift),
  });
  if(def.barrier) newDef.barrier = [def.barrier[0] + tailItemShift, def.barrier[1]];
  return newDef;
}
const LEVEL_DEFS = LEVEL_DEFS_BASE.map(extendLevel);

// ---------- Collision helpers ----------
// Ground and platforms are "landing" surfaces: they snap an entity onto
// the top, but only when the entity's feet were actually above the surface
// on the previous frame — i.e. it's genuinely landing from above, not just
// grazing a far ledge's corner while sailing past it mid-fall. Without that
// check, a fast horizontal run could get "caught" by any ledge its feet
// happened to be level with, letting players coast straight over gaps that
// are supposed to require a jump. They also never block sideways movement,
// so a missed jump still falls cleanly into the gap instead of hitting an
// invisible wall.
function resolveLanding(e, solids, prevBottom){
  for(const s of solids){
    if(!overlap(e, s)) continue;
    if(prevBottom > s.y + 1) continue; // wasn't above this surface last frame — don't snap
    e.y = s.y - e.h;
    e.vy = 0;
    e.onGround = true;
  }
}
// True solid walls (only the boss barrier uses this) block horizontal motion.
function resolveWalls(e, solids){
  for(const s of solids){
    if(!overlap(e, s)) continue;
    if(e.vx > 0) e.x = s.x - e.w;
    else if(e.vx < 0) e.x = s.x + s.w;
    else {
      const pushLeft = (e.x + e.w/2) < (s.x + s.w/2);
      e.x = pushLeft ? s.x - e.w : s.x + s.w;
    }
    e.vx = 0;
  }
}
function activeWalls(){
  if(level.hasBoss && !level.bossDefeated && level.barrier) return [level.barrier];
  return [];
}

// ---------- Combat ----------
function fireProjectile(from){
  const dir = from.facing;
  projectiles.push({ x: from.x + from.w/2 + dir*16, y: from.y + from.h*0.42, w:10, h:6, vx: dir*11, life:70, friendly:true });
  sfx.shoot();
}
function fireEnemyProjectile(en){
  // Aim at wherever the player actually is (not just a flat horizontal shot) —
  // this matters a lot for the boss, who hovers well above ground level while
  // the player stands on the ground; a purely horizontal shot would sail past
  // at head height and could never actually connect.
  const fromX = en.x + en.w/2, fromY = en.y + en.h*0.4;
  const toX = player.x + player.w/2, toY = player.y + player.h/2;
  const dx = toX - fromX, dy = toY - fromY;
  const dist = Math.max(1, Math.hypot(dx, dy));
  const speed = 6.5;
  const vx = (dx/dist) * speed, vy = (dy/dist) * speed;
  const dir = vx >= 0 ? 1 : -1;
  projectiles.push({ x: fromX + dir*8, y: fromY, w:9, h:9, vx, vy, life:130, friendly:false });
  sfx.enemyShoot();
}
let fallQuipTimer = 0;
function damagePlayer(amount, isFallDeath){
  if(godMode){
    // Invincible to harm, but still reposition out of a pit so falling
    // doesn't leave you stuck endlessly dropping with nothing below —
    // and the little "clumsy" moment still gets to show, since that's
    // just for fun, not a penalty.
    if(isFallDeath){ respawnAtCheckpoint(); fallQuipTimer = 260; }
    return;
  }
  if(player.invuln > 0 && !isFallDeath) return;
  hearts -= amount;
  player.invuln = 70;
  flashTimer = 10;
  sfx.hurt();
  if(isFallDeath) fallQuipTimer = 260;
  if(hearts <= 0) loseLife();
}
function loseLife(){
  lives -= 1;
  if(lives <= 0){
    state = 'gameOver'; stateTimer = 0; sfx.lose();
  } else {
    hearts = maxHearts;
    respawnAtCheckpoint();
  }
}
function respawnAtCheckpoint(){
  player.x = level.checkpoint.x;
  player.y = level.checkpoint.y;
  player.vx = 0; player.vy = 0; player.invuln = 90;
  camera.x = clamp(player.x - W/2, 0, Math.max(0, level.width - W));
}

// ---------- Update: player ----------
function updatePlayer(dt){
  const p = player;
  let moveDir = 0;
  if(keys['ArrowLeft'] || keys['KeyA']) moveDir -= 1;
  if(keys['ArrowRight'] || keys['KeyD']) moveDir += 1;
  p.vx = moveDir * MOVE_SPEED;
  if(moveDir !== 0) p.facing = moveDir;

  if((keys['ArrowUp'] || keys['KeyW'] || keys['Space']) && p.onGround){
    p.vy = JUMP_V;
    p.onGround = false;
    sfx.jump();
  }

  p.vy += GRAVITY;
  if(p.vy > MAX_FALL) p.vy = MAX_FALL;

  if(p.shootCooldown > 0) p.shootCooldown--;
  if((keys['KeyX'] || keys['KeyJ']) && p.shootCooldown <= 0){
    fireProjectile(p);
    p.shootCooldown = 16;
    p.shootAnim = 8;
  }
  if(p.shootAnim > 0) p.shootAnim--;

  const solids = level.solids;
  const prevBottom = p.y + p.h;
  p.x += p.vx;
  p.y += p.vy;
  p.onGround = false;
  resolveLanding(p, solids, prevBottom);
  resolveWalls(p, activeWalls());

  if(p.x < 0) p.x = 0;
  if(p.x > level.width - p.w) p.x = level.width - p.w;

  if(p.y > H + 120){
    damagePlayer(1, true);
  }

  if(moveDir !== 0 && p.onGround) p.walkT += 0.22; else p.walkT *= 0.85;
  if(p.invuln > 0) p.invuln--;
}

// ---------- Update: enemies ----------
function updateEnemy(en, dt){
  if(en.dead) return;
  const solids = level.solids;
  if(en.type === 'walker'){
    en.x += en.vx;
    if(en.x < en.patrolMin){ en.x = en.patrolMin; en.vx = Math.abs(en.vx); }
    if(en.x > en.patrolMax - en.w){ en.x = en.patrolMax - en.w; en.vx = -Math.abs(en.vx); }
    en.vy += GRAVITY;
    if(en.vy > MAX_FALL) en.vy = MAX_FALL;
    en.onGround = false;
    const prevBottom = en.y + en.h;
    en.y += en.vy;
    resolveLanding(en, solids, prevBottom);
    en.animT += 0.15;
  } else if(en.type === 'shooter'){
    en.timer--;
    const dist = Math.abs((player.x+player.w/2) - (en.x+en.w/2));
    if(en.timer <= 0 && dist < 520){
      fireEnemyProjectile(en);
      en.timer = en.fireRate;
    }
  } else if(en.type === 'flyer'){
    en.t += 0.05;
    en.y = en.baseY + Math.sin(en.t) * 34;
    en.x += en.vx;
    if(en.x < en.patrolMin) en.vx = Math.abs(en.vx);
    if(en.x > en.patrolMax) en.vx = -Math.abs(en.vx);
  } else if(en.type === 'boss'){
    updateBoss(en, dt);
  }
  if(en.hurtT > 0) en.hurtT--;
}

function updateBoss(en, dt){
  en.timer--;
  if(en.tauntTimer > 0) en.tauntTimer--;
  if(en.mode === 'hover'){
    en.t += 0.028;
    en.x = en.baseX + Math.sin(en.t) * 160;
    en.y = en.baseY + Math.sin(en.t * 1.6) * 18;
    if(en.timer <= 0){
      const roll = Math.random();
      if(roll < 0.5){ en.mode = 'dive'; en.timer = 46; en.diveFromY = en.y; }
      else { en.mode = 'burst'; en.timer = 26; }
    }
  } else if(en.mode === 'dive'){
    en.y += 6.2;
    if(en.timer <= 0 || en.y > en.baseY + 130){
      en.mode = 'hover'; en.timer = 100;
    }
  } else if(en.mode === 'burst'){
    if(en.timer === 26 || en.timer === 17 || en.timer === 8){ fireEnemyProjectile(en); }
    if(en.timer <= 0){ en.mode = 'hover'; en.timer = 100; }
  }
}

// ---------- Update: projectiles ----------
function updateProjectiles(){
  for(const pr of projectiles){ pr.x += pr.vx; pr.y += (pr.vy || 0); }
  for(const pr of projectiles) pr.life--;
  projectiles = projectiles.filter(pr =>
    pr.life > 0 && pr.x > camera.x - 60 && pr.x < camera.x + W + 60
  );
  for(const pr of projectiles){
    if(pr.life <= 0) continue;
    if(pr.friendly){
      for(const en of enemies){
        if(en.dead || en.life <= 0) continue;
        if(overlap(pr, en)){
          en.hp -= 1;
          en.hurtT = 8;
          pr.life = 0;
          spawnSpark(pr.x, pr.y, '#ffde59');
          if(en.hp <= 0){
            en.dead = true;
            spawnPoof(en.x + en.w/2, en.y + en.h/2);
            en.type === 'boss' ? sfx.bossDefeat() : sfx.hitEnemy();
          } else if(en.type === 'boss'){
            sfx.bossHit();
            if(en.tauntTimer <= 0 && Math.random() < 0.45){
              en.tauntText = BOSS_TAUNTS[Math.floor(Math.random()*BOSS_TAUNTS.length)];
              en.tauntTimer = 200;
            }
          }
          break;
        }
      }
    } else {
      if(player.invuln <= 0 && overlap(pr, player)){
        pr.life = 0;
        damagePlayer(1, false);
        player.vx = (player.x < pr.x ? -1 : 1) * 5;
      }
    }
  }
}

// ---------- Update: player vs enemies (contact) ----------
function checkPlayerEnemyContact(){
  for(const en of enemies){
    if(en.dead) continue;
    if(!overlap(player, en)) continue;
    const playerBottom = player.y + player.h;
    const fallingOnTop = player.vy > 0 && (playerBottom - en.y) < 22 && en.stompable;
    if(fallingOnTop){
      en.dead = true;
      spawnPoof(en.x + en.w/2, en.y + en.h/2);
      player.vy = JUMP_V * 0.55;
      sfx.stomp();
    } else if(player.invuln <= 0){
      damagePlayer(1, false);
      player.vx = (player.x < en.x ? -1 : 1) * 6;
      player.vy = -6.5;
    }
  }
}

// ---------- Update: pickups ----------
function checkPickups(){
  for(const pk of pickups){
    if(pk.collected) continue;
    if(!overlap(player, pk)) continue;
    pk.collected = true;
    if(pk.type === 'gem'){ gems++; totalGemsCollected++; sfx.gem(); spawnSpark(pk.x+9, pk.y+9, '#7fd8ff'); }
    else if(pk.type === 'heart'){ if(hearts < maxHearts) hearts++; sfx.heart(); }
    else if(pk.type === 'oneup'){ lives++; sfx.oneUp(); }
    else if(pk.type === 'checkpoint'){ level.checkpoint = { x: pk.x - 8, y: GROUND_Y - player.h }; sfx.checkpoint(); }
  }
}

// ---------- Rendering: background ----------
let frameCount = 0;

function tiledDecor(camX, factor, spacing, seedBase, drawFn){
  const offset = camX * factor;
  const start = Math.floor((offset - 150) / spacing) - 1;
  const end = Math.floor((offset + W + 150) / spacing) + 1;
  for(let i = start; i <= end; i++){
    const seed = seedBase + i * 31;
    const x = i * spacing + seededRand(seed) * 40 - offset;
    drawFn(x, seed);
  }
}

function renderBackground(theme, camX, seed){
  const t = THEMES[theme];
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, t.sky1);
  grad.addColorStop(1, t.sky2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // far layer
  ctx.fillStyle = t.far;
  const farY = 360;
  if(theme === 'fjord' || theme === 'volcanic'){
    tiledDecor(camX, 0.15, 260, seed, (x, sd) => {
      const h = 70 + seededRand(sd+2) * 60;
      ctx.beginPath();
      ctx.moveTo(x - 90, farY); ctx.lineTo(x, farY - h); ctx.lineTo(x + 90, farY);
      ctx.closePath(); ctx.fill();
    });
  } else {
    tiledDecor(camX, 0.15, 240, seed, (x, sd) => {
      const r = 55 + seededRand(sd+2) * 40;
      ctx.beginPath(); ctx.ellipse(x, farY, r, r*0.55, 0, Math.PI, 2*Math.PI); ctx.fill();
    });
  }

  // near layer
  ctx.fillStyle = t.near;
  const nearY = 420;
  tiledDecor(camX, 0.35, 200, seed + 500, (x, sd) => {
    const r = 45 + seededRand(sd+2) * 35;
    ctx.beginPath(); ctx.ellipse(x, nearY, r, r*0.5, 0, Math.PI, 2*Math.PI); ctx.fill();
  });

  // theme-specific accents
  if(theme === 'fjord'){
    tiledDecor(camX, 0.5, 420, seed + 900, (x, sd) => {
      const puff = 8 + Math.sin(frameCount * 0.05 + sd) * 3;
      ctx.fillStyle = 'rgba(255,255,255,0.55)';
      for(let k=0;k<3;k++){
        ctx.beginPath();
        ctx.arc(x, nearY - 20 - k*14, puff - k*2, 0, Math.PI*2);
        ctx.fill();
      }
    });
  } else if(theme === 'savanna'){
    tiledDecor(camX, 0.5, 260, seed + 900, (x, sd) => {
      const th = 40 + seededRand(sd+3) * 20;
      ctx.strokeStyle = '#5a3a1c'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x, nearY+10); ctx.lineTo(x, nearY+10-th); ctx.stroke();
      ctx.fillStyle = '#3f6b2a';
      ctx.beginPath(); ctx.ellipse(x, nearY+10-th, 34, 14, 0, 0, Math.PI*2); ctx.fill();
    });
  } else if(theme === 'volcanic'){
    tiledDecor(camX, 0.6, 300, seed + 900, (x, sd) => {
      const glow = 0.35 + Math.sin(frameCount*0.08 + sd) * 0.15;
      ctx.fillStyle = `rgba(255,122,60,${Math.max(glow,0.1)})`;
      ctx.beginPath(); ctx.ellipse(x, GROUND_Y - 2, 60, 8, 0, 0, Math.PI*2); ctx.fill();
    });
  } else if(theme === 'rainforest'){
    tiledDecor(camX, 0.5, 220, seed + 900, (x, sd) => {
      const th = 55 + seededRand(sd+3) * 25;
      ctx.strokeStyle = '#3f2c18'; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(x, nearY+30); ctx.lineTo(x, nearY+30-th); ctx.stroke();
      ctx.fillStyle = '#2c4f22';
      for(let k=0;k<3;k++){
        ctx.beginPath(); ctx.ellipse(x - 10 + k*10, nearY+30-th-k*8, 28, 16, 0, 0, Math.PI*2); ctx.fill();
      }
    });
    tiledDecor(camX, 0.7, 500, seed + 1500, (x, sd) => {
      ctx.fillStyle = 'rgba(200,230,255,0.35)';
      ctx.fillRect(x, 0, 6, H);
    });
  } else if(theme === 'dungeon'){
    tiledDecor(camX, 0.55, 260, seed + 900, (x, sd) => {
      const flick = 0.7 + Math.sin(frameCount*0.2 + sd) * 0.3;
      ctx.fillStyle = '#3a3440'; ctx.fillRect(x-4, nearY-70, 8, 110);
      ctx.fillStyle = `rgba(255,170,60,${flick})`;
      ctx.beginPath(); ctx.ellipse(x, nearY-80, 7, 11, 0, 0, Math.PI*2); ctx.fill();
    });
  }
}

// ---------- Rendering: solids ----------
// Theme-appropriate surface detail drawn on top of each ground piece —
// purely decorative, seeded by world position so it's stable across frames
// (no flicker) rather than re-randomized every draw.
function drawGroundTexture(theme, sx, s){
  const seedBase = Math.floor(s.x / 10);
  if(theme === 'fjord'){
    for(let x=10; x<s.w-10; x+=34){
      const seed = seedBase + x;
      if(seededRand(seed) <= 0.45) continue;
      ctx.fillStyle = 'rgba(255,255,255,0.6)';
      const px = sx+x, py = s.y + 9 + seededRand(seed+1)*7;
      ctx.beginPath();
      ctx.moveTo(px, py-4); ctx.lineTo(px+3, py); ctx.lineTo(px, py+4); ctx.lineTo(px-3, py);
      ctx.closePath(); ctx.fill();
    }
  } else if(theme === 'savanna'){
    ctx.strokeStyle = 'rgba(90,58,28,0.5)'; ctx.lineWidth = 2;
    for(let x=8; x<s.w-8; x+=24){
      const seed = seedBase + x;
      const px = sx+x, py = s.y+6;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px - 3 + seededRand(seed)*6, py - 7 - seededRand(seed+1)*5);
      ctx.stroke();
    }
  } else if(theme === 'volcanic'){
    for(let x=14; x<s.w-14; x+=44){
      const seed = seedBase + x;
      const glow = 0.28 + Math.sin(frameCount*0.06 + seed) * 0.14;
      ctx.strokeStyle = `rgba(255,122,60,${Math.max(glow,0.12)})`; ctx.lineWidth = 2;
      const px = sx+x, py = s.y + 13 + seededRand(seed)*18;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(px + 14 + seededRand(seed+1)*10, py + 5);
      ctx.stroke();
    }
  } else if(theme === 'rainforest'){
    for(let x=10; x<s.w-10; x+=28){
      const seed = seedBase + x;
      if(seededRand(seed) <= 0.4) continue;
      ctx.fillStyle = 'rgba(40,70,25,0.5)';
      ctx.beginPath(); ctx.ellipse(sx+x, s.y+11, 8, 4, 0, 0, Math.PI*2); ctx.fill();
    }
  } else if(theme === 'dungeon'){
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1.5;
    for(let x=0; x<s.w; x+=36){
      ctx.beginPath(); ctx.moveTo(sx+x, s.y+6); ctx.lineTo(sx+x, s.y+s.h); ctx.stroke();
    }
  }
}

function renderSolids(){
  const t = THEMES[level.theme];
  const gr = level.groundRects;

  // Pits: fill every gap between ground pieces with a dark, high-contrast
  // chasm so the danger zone is unmistakable — this matters most in pale
  // themes like the fjord, where a plain background gap barely differs
  // from the ice-white ground around it.
  for(let i=0;i<gr.length-1;i++){
    const cur = gr[i], next = gr[i+1];
    const gapX = cur.x + cur.w, gapW = next.x - gapX;
    if(gapW <= 0) continue;
    const sx = gapX - camera.x;
    if(sx + gapW < -20 || sx > W + 20) continue;
    const grad = ctx.createLinearGradient(0, cur.y, 0, cur.y + 100);
    grad.addColorStop(0, 'rgba(6,7,14,0.96)');
    grad.addColorStop(1, 'rgba(2,2,6,0.99)');
    ctx.fillStyle = grad;
    ctx.fillRect(sx, cur.y, gapW, H - cur.y);
    ctx.fillStyle = 'rgba(255,214,140,0.4)';
    ctx.fillRect(sx, cur.y, gapW, 3);
  }

  for(let i=0;i<gr.length;i++){
    const s = gr[i];
    const sx = s.x - camera.x;
    if(sx + s.w < -20 || sx > W + 20) continue;
    ctx.fillStyle = t.ground;
    ctx.fillRect(sx, s.y, s.w, s.h);
    ctx.fillStyle = t.groundLine;
    ctx.fillRect(sx, s.y, s.w, 6);
    ctx.fillStyle = t.groundDk;
    ctx.fillRect(sx, s.y + s.h - 4, s.w, 4);
    drawGroundTexture(level.theme, sx, s);
    // Bright edge accent marking exactly where a ledge drops into a pit.
    ctx.fillStyle = 'rgba(255,220,150,0.95)';
    if(i > 0) ctx.fillRect(sx, s.y, 3, s.h);
    if(i < gr.length-1) ctx.fillRect(sx + s.w - 3, s.y, 3, s.h);
  }
  for(const s of level.platforms){
    const sx = s.x - camera.x;
    if(sx + s.w < -20 || sx > W + 20) continue;
    ctx.fillStyle = t.platform;
    ctx.fillRect(sx, s.y, s.w, s.h);
    ctx.fillStyle = t.platformDk;
    ctx.fillRect(sx, s.y + s.h - 4, s.w, 4);
  }
  if(level.hasBoss && !level.bossDefeated && level.barrier){
    const b = level.barrier;
    const sx = b.x - camera.x;
    const pulse = 0.5 + Math.sin(frameCount * 0.1) * 0.2;
    ctx.fillStyle = `rgba(224,162,60,${pulse})`;
    ctx.fillRect(sx, b.y, b.w, b.h);
    ctx.strokeStyle = 'rgba(255,220,150,0.8)';
    ctx.strokeRect(sx, b.y, b.w, b.h);
  }
}

// ---------- Rendering: character ----------
// Fraction of each sprite's height where the legs begin — used to split the
// image into a static torso and an animatable leg region (see below).
const SPRITE_LEG_SPLIT = { ragnheidur: 0.60, stuart: 0.56 };

function drawCharacter(x, y, w, h, facing, walkT, onGround, type, shootAnim, hurt, invulnBlink){
  if(invulnBlink && frameCount % 6 < 3) return; // blink while invulnerable
  const sx = x - camera.x;

  if(onGround){
    ctx.fillStyle = 'rgba(0,0,0,0.25)';
    ctx.beginPath();
    ctx.ellipse(sx + w*0.5, y + h + 2, w*0.42, 5, 0, 0, Math.PI*2);
    ctx.fill();
  }

  const img = SPRITE[type];
  if(!img || !img.complete || img.naturalWidth === 0){
    drawCharacterProcedural(sx, y, w, h, facing, walkT, onGround, type, shootAnim, hurt);
    return;
  }

  // The sprite art is drawn larger than the tight gameplay hitbox (w x h)
  // for readability — a common platformer convention — anchored at the
  // feet so collision stays exactly where the hitbox says regardless of
  // the art's own proportions. A slight bob simulates a run cycle since
  // this is a single running-pose image, not a multi-frame sheet.
  const drawH = h * 1.55;
  const drawW = drawH * (img.naturalWidth / img.naturalHeight);
  const bob = onGround ? Math.abs(Math.sin(walkT)) * 3 : 0;
  const footX = sx + w/2, footY = y + h;

  ctx.save();
  ctx.translate(footX, footY - bob);
  if(facing < 0) ctx.scale(-1, 1);

  // Cheap 2-frame "stride" from one static pose: the torso/arms/gun draw
  // normally, but the leg region alternately mirrors left-right in place,
  // which — since the pose already has one leg forward and one back —
  // reads as alternating strides instead of a static running pose.
  const split = SPRITE_LEG_SPLIT[type] || 0.58;
  const splitPx = img.naturalHeight * split;
  const torsoH = drawH * split;
  const legH = drawH - torsoH;
  const strideFlip = onGround && Math.sin(walkT) < 0;

  ctx.drawImage(img, 0, 0, img.naturalWidth, splitPx, -drawW/2, -drawH, drawW, torsoH);
  ctx.save();
  if(strideFlip) ctx.scale(-1, 1);
  ctx.drawImage(img, 0, splitPx, img.naturalWidth, img.naturalHeight - splitPx, -drawW/2, -legH, drawW, legH);
  ctx.restore();

  if(hurt){
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(255,60,60,0.45)';
    ctx.fillRect(-drawW/2, -drawH, drawW, drawH);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();

  if(shootAnim > 0){
    ctx.fillStyle = 'rgba(255,230,140,0.9)';
    const mx = footX + facing * drawW * 0.46;
    const my = footY - drawH * 0.52;
    ctx.beginPath(); ctx.arc(mx, my, 6, 0, Math.PI*2); ctx.fill();
  }
}

// Fallback renderer used only if a sprite image hasn't finished loading yet
// (e.g. the very first frame or two after opening the page).
function drawCharacterProcedural(sx, y, w, h, facing, walkT, onGround, type, shootAnim, hurt){
  const pal = PALETTES[type];
  ctx.save();

  const legLift = onGround ? Math.sin(walkT) * 9 : 0;
  const legSpread = onGround ? 0 : 4;

  // legs
  ctx.fillStyle = pal.overallsDk;
  ctx.fillRect(sx + w*0.18, y + h*0.62 - Math.max(legLift,0), w*0.28, h*0.38 + Math.min(legLift,0)*-1);
  ctx.fillRect(sx + w*0.54, y + h*0.62 + Math.max(-legLift,0) - legSpread, w*0.28, h*0.38 - Math.max(-legLift,0)+legSpread);
  // boots
  ctx.fillStyle = pal.boot;
  ctx.fillRect(sx + w*0.16, y + h - 10, w*0.32, 10);
  ctx.fillRect(sx + w*0.52, y + h - 10, w*0.32, 10);

  // torso (overalls)
  ctx.fillStyle = pal.overalls;
  ctx.fillRect(sx + w*0.12, y + h*0.30, w*0.76, h*0.36);
  // shirt / straps
  ctx.fillStyle = pal.shirt;
  ctx.fillRect(sx + w*0.10, y + h*0.20, w*0.80, h*0.16);

  // arm holding gun
  ctx.fillStyle = pal.shirt;
  const armY = y + h*0.34 + (shootAnim ? -2 : 0);
  ctx.fillRect(sx + (facing>0? w*0.62 : w*0.02), armY, w*0.36, h*0.12);

  // gun
  ctx.fillStyle = pal.gun;
  const gunX = facing > 0 ? sx + w*0.92 : sx - w*0.30;
  ctx.fillRect(gunX, armY - 2, w*0.42, h*0.09);
  if(shootAnim > 0){
    ctx.fillStyle = 'rgba(255,230,140,0.9)';
    const mx = facing > 0 ? gunX + w*0.42 : gunX;
    ctx.beginPath(); ctx.arc(mx, armY + 2, 6, 0, Math.PI*2); ctx.fill();
  }

  // head
  ctx.fillStyle = hurt ? '#ff8888' : pal.skin;
  ctx.beginPath();
  ctx.arc(sx + w*0.5, y + h*0.14, w*0.30, 0, Math.PI*2);
  ctx.fill();

  // hair
  ctx.fillStyle = pal.hair;
  if(type === 'ragnheidur'){
    ctx.beginPath();
    ctx.ellipse(sx + w*0.32, y + h*0.16, w*0.14, h*0.10, -0.3, 0, Math.PI*2);
    ctx.fill();
    // cap
    ctx.fillStyle = pal.cap;
    ctx.beginPath();
    ctx.arc(sx + w*0.5, y + h*0.10, w*0.32, Math.PI, 2*Math.PI);
    ctx.fill();
    ctx.fillRect(sx + w*0.5 - (facing>0?0:w*0.34), y + h*0.06, facing>0? w*0.34 : w*0.34, h*0.06);
    ctx.fillStyle = pal.capBadge;
    ctx.beginPath(); ctx.arc(sx + w*0.5, y + h*0.06, 3.5, 0, Math.PI*2); ctx.fill();
  } else {
    // beard
    ctx.fillStyle = '#6a6a6a';
    ctx.fillRect(sx + w*0.28, y + h*0.16, w*0.44, h*0.12);
    // glasses
    ctx.strokeStyle = pal.glasses; ctx.lineWidth = 1.6;
    ctx.strokeRect(sx + w*0.24, y + h*0.10, w*0.20, h*0.08);
    ctx.strokeRect(sx + w*0.52, y + h*0.10, w*0.20, h*0.08);
    ctx.beginPath(); ctx.moveTo(sx+w*0.44,y+h*0.13); ctx.lineTo(sx+w*0.52,y+h*0.13); ctx.stroke();
  }

  ctx.restore();
}

// ---------- Rendering: enemies ----------
// Draws an enemy's creature art centered at (cx,cy) with a given target
// height (width follows the source image's own aspect ratio), optionally
// mirrored, with the same white hit-flash used elsewhere. Returns false if
// the image isn't loaded yet so the caller can fall back to a simple shape.
function drawEnemySprite(img, cx, cy, targetH, flipX, flash){
  if(!img || !img.complete || img.naturalWidth === 0) return false;
  const h = targetH;
  const w = h * (img.naturalWidth / img.naturalHeight);
  ctx.save();
  ctx.translate(cx, cy);
  if(flipX) ctx.scale(-1, 1);
  ctx.drawImage(img, -w/2, -h/2, w, h);
  if(flash){
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillStyle = 'rgba(255,255,255,0.75)';
    ctx.fillRect(-w/2, -h/2, w, h);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.restore();
  return true;
}
function drawEnemy(en){
  if(en.dead) return;
  const sx = en.x - camera.x;
  if(sx + en.w < -30 || sx > W + 30) return;
  const flash = en.hurtT > 0;
  if(en.type === 'walker'){
    const bob = Math.sin(en.animT) * 2;
    const targetH = en.h * 1.9;
    const cx = sx + en.w/2;
    const cy = (en.y + en.h + bob) - targetH/2; // bottom-anchored so feet sit on the ground
    const flip = en.vx < 0; // creature art faces right by default
    if(!drawEnemySprite(ENEMY_IMG[en.creature], cx, cy, targetH, flip, flash)){
      ctx.fillStyle = flash ? '#ffffff' : themeEnemyColor(level.theme, 0);
      ctx.beginPath();
      ctx.ellipse(sx + en.w/2, en.y + en.h/2 + bob, en.w/2, en.h/2, 0, 0, Math.PI*2);
      ctx.fill();
    }
  } else if(en.type === 'shooter'){
    const targetH = en.h * 2.1;
    const cx = sx + en.w/2;
    const cy = (en.y + en.h) - targetH/2;
    const flip = player.x < en.x; // faces toward the player, like a little sentry
    if(!drawEnemySprite(ENEMY_IMG[en.creature], cx, cy, targetH, flip, flash)){
      ctx.fillStyle = flash ? '#ffffff' : themeEnemyColor(level.theme, 1);
      ctx.fillRect(sx, en.y + en.h*0.3, en.w, en.h*0.7);
      ctx.beginPath(); ctx.arc(sx + en.w/2, en.y + en.h*0.28, en.w*0.4, Math.PI, 2*Math.PI); ctx.fill();
    }
  } else if(en.type === 'flyer'){
    const targetH = en.h * 2.3;
    const cx = sx + en.w/2, cy = en.y + en.h/2;
    const flip = en.vx < 0;
    if(!drawEnemySprite(ENEMY_IMG[en.creature], cx, cy, targetH, flip, flash)){
      ctx.fillStyle = flash ? '#ffffff' : themeEnemyColor(level.theme, 2);
      ctx.beginPath();
      ctx.ellipse(sx + en.w/2, en.y + en.h/2, en.w/2, en.h/2, 0, 0, Math.PI*2);
      ctx.fill();
    }
  } else if(en.type === 'boss'){
    drawBoss(en, sx, flash);
  }
}
function themeEnemyColor(theme, idx){
  const sets = {
    fjord:     ['#7a97a8', '#4f6f80', '#c9d8de'],
    savanna:   ['#8a6a3c', '#5c4526', '#c99a4f'],
    volcanic:  ['#5c3a2e', '#8a3a2a', '#ff7a3c'],
    rainforest:['#3d5e2a', '#2a4a1e', '#6b8c47'],
    dungeon:   ['#5a5460', '#3e3844', '#8a7f95'],
  };
  return sets[theme][idx];
}
function drawBoss(en, sx, flash){
  const cx = sx + en.w/2, cy = en.y + en.h/2;
  const img = BOSS_IMG;
  let drawH = en.h * 2.9, drawW = drawH * 0.7;
  if(img && img.complete && img.naturalWidth > 0){
    drawW = drawH * (img.naturalWidth / img.naturalHeight);
    ctx.save();
    ctx.translate(cx, cy);
    ctx.drawImage(img, -drawW/2, -drawH/2, drawW, drawH);
    if(flash){
      ctx.globalCompositeOperation = 'source-atop';
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fillRect(-drawW/2, -drawH/2, drawW, drawH);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.restore();
  } else {
    // Fallback shown only for the brief moment before the image finishes loading.
    const pulse = Math.sin(frameCount*0.15)*4;
    ctx.fillStyle = flash ? '#ffffff' : '#3a2440';
    ctx.beginPath();
    ctx.ellipse(cx, cy + pulse*0.2, en.w/2 + pulse, en.h/2, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#e0a23c'; ctx.lineWidth = 3;
    ctx.stroke();
  }

  // boss health bar
  const barW = 220, barX = W/2 - barW/2, barY = 24;
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(barX, barY, barW, 12);
  ctx.fillStyle = '#e0a23c';
  ctx.fillRect(barX, barY, barW * clamp(en.hp/en.maxHp,0,1), 12);
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.strokeRect(barX, barY, barW, 12);
  ctx.fillStyle = '#eee'; ctx.font = '10px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('RAGGA MUFFIN', W/2, barY - 4);

  if(en.tauntTimer > 0){
    const a = clamp(en.tauntTimer / 20, 0, 1) * (en.tauntTimer > 180 ? clamp((200-en.tauntTimer)/20, 0, 1) : 1);
    ctx.save();
    ctx.globalAlpha = a;
    const bubbleY = cy - drawH/2 - 10;
    ctx.font = 'bold 11px "Nunito", sans-serif';
    const textW = ctx.measureText(en.tauntText).width;
    ctx.fillStyle = 'rgba(10,10,18,0.75)';
    ctx.fillRect(cx - textW/2 - 8, bubbleY - 14, textW + 16, 20);
    ctx.fillStyle = '#ffdb6b';
    ctx.textAlign = 'center';
    ctx.fillText(en.tauntText, cx, bubbleY);
    ctx.restore();
  }
}

// Ragga Muffin's look for cutscenes — same sprite as the in-level boss
// (drawBoss above), so the villain reads as the same character in the
// kidnapping scene and the final fight.
function drawRaggaMuffinFigure(cx, cy, scale, alpha){
  if(alpha <= 0) return;
  const img = BOSS_IMG;
  ctx.save();
  ctx.globalAlpha = alpha;
  if(img && img.complete && img.naturalWidth > 0){
    const drawH = 150 * scale;
    const drawW = drawH * (img.naturalWidth / img.naturalHeight);
    ctx.drawImage(img, cx - drawW/2, cy - drawH/2, drawW, drawH);
  } else {
    // Fallback shown only for the brief moment before the image finishes loading.
    const pulse = Math.sin(frameCount*0.15) * 3 * scale;
    ctx.fillStyle = '#3a2440';
    ctx.beginPath();
    ctx.ellipse(cx, cy + pulse*0.2, 44*scale + pulse, 56*scale, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = '#e0a23c'; ctx.lineWidth = 3;
    ctx.stroke();
  }
  ctx.restore();
}

// Simple prison-cage silhouette, used in the kidnap and rescue cutscenes.
function drawCage(cx, cy, w, h, alpha, openAmount){
  if(alpha <= 0) return;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.strokeStyle = '#8a94ad'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  const bars = 5;
  const open = openAmount || 0;
  for(let i = 0; i < bars; i++){
    const bx = cx - w/2 + (w/(bars-1)) * i;
    const swing = (i === 0 || i === bars-1) ? 0 : open * (i - (bars-1)/2) * 18;
    ctx.beginPath();
    ctx.moveTo(bx, cy - h/2);
    ctx.lineTo(bx + swing, cy + h/2);
    ctx.stroke();
  }
  ctx.beginPath();
  ctx.moveTo(cx - w/2, cy - h/2); ctx.lineTo(cx + w/2, cy - h/2);
  ctx.moveTo(cx - w/2, cy + h/2); ctx.lineTo(cx + w/2, cy + h/2);
  ctx.stroke();
  ctx.restore();
}

// ---------- Rendering: projectiles & particles & pickups ----------
function drawProjectiles(){
  for(const pr of projectiles){
    const sx = pr.x - camera.x;
    ctx.fillStyle = pr.friendly ? '#ffe081' : '#ff5f6b';
    ctx.beginPath();
    ctx.ellipse(sx, pr.y, pr.w/2, pr.h/2, 0, 0, Math.PI*2);
    ctx.fill();
  }
}
function drawParticles(){
  for(const p of particles){
    ctx.globalAlpha = Math.max(p.life / p.maxLife, 0);
    if(p.shape === 'heart'){
      drawHeartShape(p.x - camera.x, p.y, p.r, p.color);
    } else {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x - camera.x, p.y, p.r, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}
function drawPickups(){
  for(const pk of pickups){
    if(pk.collected) continue;
    const sx = pk.x - camera.x;
    if(sx < -30 || sx > W + 30) continue;
    const bob = Math.sin(frameCount*0.08 + pk.x) * 3;
    if(pk.type === 'gem'){
      ctx.fillStyle = '#3fa9e0';
      ctx.beginPath();
      ctx.moveTo(sx+9, pk.y+bob); ctx.lineTo(sx+18, pk.y+9+bob); ctx.lineTo(sx+9, pk.y+18+bob); ctx.lineTo(sx, pk.y+9+bob);
      ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#dff4ff'; ctx.lineWidth=1.5; ctx.stroke();
    } else if(pk.type === 'heart'){
      drawHeartShape(sx+11, pk.y+11+bob, 10, '#e0435c');
    } else if(pk.type === 'oneup'){
      ctx.fillStyle = '#3fbf5f';
      ctx.beginPath(); ctx.arc(sx+13, pk.y+13+bob, 13, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 9px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('1UP', sx+13, pk.y+16+bob);
    } else if(pk.type === 'checkpoint'){
      ctx.strokeStyle = '#c9c9c9'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.moveTo(sx+2, pk.y+26); ctx.lineTo(sx+2, pk.y-14); ctx.stroke();
      ctx.fillStyle = level.checkpoint.x === pk.x - 8 ? '#3fbf5f' : '#e0a23c';
      ctx.beginPath(); ctx.moveTo(sx+2, pk.y-14); ctx.lineTo(sx+22, pk.y-8); ctx.lineTo(sx+2, pk.y-2); ctx.closePath(); ctx.fill();
    }
  }
}
function drawHeartShape(cx, cy, size, color){
  ctx.fillStyle = color;
  ctx.beginPath();
  const s = size/10;
  ctx.moveTo(cx, cy + 6*s);
  ctx.bezierCurveTo(cx - 10*s, cy - 4*s, cx - 4*s, cy - 10*s, cx, cy - 3*s);
  ctx.bezierCurveTo(cx + 4*s, cy - 10*s, cx + 10*s, cy - 4*s, cx, cy + 6*s);
  ctx.closePath();
  ctx.fill();
}
function wrapText(text, maxWidth){
  const words = text.split(' ');
  const lines = [];
  let current = '';
  for(const word of words){
    const test = current ? current + ' ' + word : word;
    if(current && ctx.measureText(test).width > maxWidth){
      lines.push(current);
      current = word;
    } else {
      current = test;
    }
  }
  if(current) lines.push(current);
  return lines;
}
// Shared style for her personal messages sprinkled through the game — same
// warm pink glow as the birthday wish on the title screen, everywhere it
// shows up. Returns the number of lines drawn (wraps long messages).
function drawCommentaryText(text, x, y, opts){
  opts = opts || {};
  const size = opts.size || 15;
  const maxWidth = opts.maxWidth || 780;
  const lineHeight = opts.lineHeight || (size + 9);
  ctx.save();
  ctx.font = `bold ${size}px "Nunito", sans-serif`;
  ctx.textAlign = 'center';
  const lines = wrapText(text, maxWidth);
  ctx.fillStyle = '#ffb3c1';
  ctx.shadowColor = '#ff8fa3';
  ctx.shadowBlur = 12 + Math.sin(frameCount*0.06) * 4;
  lines.forEach((line, i) => ctx.fillText(line, x, y + i*lineHeight));
  ctx.restore();
  return lines.length;
}

// ---------- Goal / boss defeat ----------
function checkLevelProgress(){
  if(level.hasBoss && !level.bossDefeated){
    const boss = enemies.find(e => e.type === 'boss');
    if(boss && boss.dead) level.bossDefeated = true;
  }
  if(player.x + player.w > level.goalX){
    if(level.isFinal){
      state = 'rescue'; stateTimer = 0; camera.x = 0; sfx.win();
    } else {
      state = 'levelClear'; stateTimer = 0; sfx.confirm();
    }
  }
}

function renderKidnap(){
  drawScreenBackdrop();
  const capturedType = selectedChar === 'ragnheidur' ? 'stuart' : 'ragnheidur';
  const capturedName = capturedType === 'ragnheidur' ? 'Ragnheiður' : 'Stuart';
  titleText('MEANWHILE...', 56, 14, '#ff8fa3');

  const cw = CUTSCENE_CHAR_W, ch = CUTSCENE_CHAR_H;
  const groundY = 400;
  const t = stateTimer;
  // Paced slower than a typical game-logic beat on purpose — this is the
  // story setup, so each phase gets enough screen time to actually read.
  const HOLD_END = 40, APPROACH_END = 130, STRUGGLE_END = 260, DRAG_END = 400, CAGE_END = 660;
  const vkOffset = cw + 140; // villain's now a full detailed figure, not an abstract blob — needs real breathing room so it doesn't cover the captured character

  const charBaseX = W/2 - cw/2, charY = groundY - ch;
  let charX = charBaseX, charAlpha = 1, shakeX = 0, shakeY = 0;
  let vkAlpha = 0, vkX = W + 110, vkScale = 1.55;
  let cageAlpha = 0;

  if(t < HOLD_END){
    // quiet beat before anything happens
  } else if(t < APPROACH_END){
    const p = (t - HOLD_END) / (APPROACH_END - HOLD_END);
    vkAlpha = clamp(p * 1.4, 0, 1);
    vkX = lerp(W + 110, charBaseX + vkOffset, easeOutQuad(p));
    if(t === HOLD_END + 1) sfx.villainAppear();
  } else if(t < STRUGGLE_END){
    vkAlpha = 1;
    vkX = charBaseX + vkOffset;
    shakeX = Math.sin(t * 2.6) * 5;
    shakeY = Math.cos(t * 3.1) * 2.5;
    if((t - APPROACH_END) % 16 === 0){ sfx.struggle(); spawnSpark(charBaseX + cw/2, charY + 30, '#cfd3e0'); }
  } else if(t < DRAG_END){
    const p = (t - STRUGGLE_END) / (DRAG_END - STRUGGLE_END);
    vkAlpha = 1 - p * 0.15;
    const dragTargetX = W + 160;
    vkX = lerp(charBaseX + vkOffset, dragTargetX, easeInQuad(p));
    charX = lerp(charBaseX, dragTargetX - vkOffset, easeInQuad(p));
    charAlpha = 1 - p;
    if(t === STRUGGLE_END + 1) sfx.dragOff();
  } else {
    charAlpha = 0; vkAlpha = 0;
    cageAlpha = clamp((t - DRAG_END) / 30, 0, 1);
  }

  if(charAlpha > 0){
    ctx.save();
    ctx.globalAlpha = charAlpha;
    ctx.translate(shakeX, shakeY);
    drawCharacter(charX, charY, cw, ch, -1, 0, true, capturedType, 0, t > APPROACH_END && t < DRAG_END, false);
    ctx.restore();
  }
  drawRaggaMuffinFigure(vkX, groundY - ch*0.62, vkScale, vkAlpha);
  if(cageAlpha > 0){
    const cageW = 190, cageH = 230, cageCX = W/2, cageCY = 300;
    drawCage(cageCX, cageCY, cageW, cageH, cageAlpha, 0);
    ctx.save();
    ctx.globalAlpha = cageAlpha;
    drawCharacter(cageCX - cw/2, cageCY + cageH/2 - 18 - ch, cw, ch, 1, 0, true, capturedType, 0, false, false);
    ctx.restore();
  }

  ctx.font = '13px "Nunito", sans-serif';
  ctx.fillStyle = '#e6e9f2';
  ctx.textAlign = 'center';
  let line;
  if(t < HOLD_END) line = 'It\u2019s a quiet evening...';
  else if(t < APPROACH_END) line = '...but someone else is watching.';
  else if(t < STRUGGLE_END) line = capturedName + ' never saw it coming...';
  else if(t < DRAG_END) line = 'Struggling won\u2019t help now...';
  else line = '...and now ' + capturedName + ' is locked away.';
  ctx.fillText(line, W/2, 460);

  ctx.font = '11px "Nunito", sans-serif';
  ctx.fillStyle = '#6b7086';
  ctx.fillText('press enter to skip', W/2, 505);

  stateTimer++;
  if(justPressed('Enter') || stateTimer > CAGE_END){
    state = 'storyIntro'; stateTimer = 0;
  }
}

  const cw = CUTSCENE_CHAR_W, ch = CUTSCENE_CHAR_H;
  const groundY = 400;
  const cageX = W*0.7, heroStartX = W*0.12, meetLeftX = W/2 - cw - 8, meetRightX = W/2 + 8;
  const t = stateTimer;
  const P1 = 70, P2 = 170;

  let cageOpen, capturedX, heroX, walkT = 0;
  if(t < P1){
    cageOpen = clamp(t/P1, 0, 1);
    capturedX = cageX; heroX = heroStartX;
    if(t === 1) sfx.reunite();
  } else if(t < P2){
    cageOpen = 1;
    const p = (t-P1)/(P2-P1);
    capturedX = lerp(cageX, meetRightX, easeOutQuad(p));
    heroX = lerp(heroStartX, meetLeftX, easeOutQuad(p));
    walkT = t*0.3;
  } else {
    cageOpen = 1;
    capturedX = meetRightX; heroX = meetLeftX;
    if(t === P2+1) spawnCelebration((meetLeftX+meetRightX)/2 + cw/2, groundY - ch*0.5, 20);
  }

  drawCage(cageX, 300, 170, 210, 1, cageOpen);
  drawCharacter(heroX, groundY-ch, cw, ch, 1, walkT, true, selectedChar, 0, false, false);
  drawCharacter(capturedX, groundY-ch, cw, ch, -1, walkT, true, other, 0, false, false);

  ctx.font = '13px "Nunito", sans-serif';
  ctx.fillStyle = '#e6e9f2';
  ctx.textAlign = 'center';
  let line;
  if(t < P1) line = 'The cage begins to give way...';
  else if(t < P2) line = otherName + ' comes running!';
  else line = 'The cage door swings open. ' + otherName + ' is free.';
  ctx.fillText(line, W/2, 452);

  stateTimer++;
  if(stateTimer > P2+40 && Math.floor(frameCount/30)%2===0){
    ctx.font = '13px "Press Start 2P", monospace';
    ctx.fillText('PRESS ENTER', W/2, 490);
  }
  if(stateTimer > P2+40 && justPressed('Enter')){
    state = 'win'; stateTimer = 0; sfx.confirm();
  }
}

function renderWin(){
  drawScreenBackdrop();
  titleText('MISSION COMPLETE', 80, 18, '#ffcf6b');

  const r = IMG.ragnheidur, s = IMG.stuart;
  const areaH = 210;
  if(r.complete && s.complete){
    const rs = areaH/r.naturalHeight, ss = areaH/s.naturalHeight;
    const rw = r.naturalWidth*rs, sw = s.naturalWidth*ss;
    const totalW = rw + sw + 20;
    const startX = W/2 - totalW/2;
    ctx.drawImage(r, startX, 130, rw, areaH);
    ctx.drawImage(s, startX + rw + 20, 130, sw, areaH);
  }

  if(frameCount % 12 === 0){
    spawnConfettiDrop(20 + Math.random()*(W-40));
  }

  ctx.font = '13px "Nunito", sans-serif';
  ctx.fillStyle = '#e6e9f2';
  ctx.textAlign = 'center';
  ctx.fillText('Together again. The End. ❤', W/2, 372);
  ctx.font = '12px "Nunito", sans-serif';
  ctx.fillStyle = '#c9cee0';
  ctx.fillText('Total gems collected: ' + totalGemsCollected + '   ·   Lives remaining: ' + lives, W/2, 400);

  stateTimer++;
  if(stateTimer > 40 && Math.floor(frameCount/30)%2===0){
    ctx.font = '13px "Press Start 2P", monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('PRESS ENTER TO CONTINUE', W/2, 460);
  }
  if(stateTimer > 40 && justPressed('Enter')){
    state = 'endVideo'; stateTimer = 0; sfx.confirm();
  }
}

// A short animated clip between the win screen and the credits. It's her
// own custom character art, played once, muted (browsers block autoplay
// with sound anyway, and this doesn't need it), skippable like every other
// cutscene in the game.
let endVideoStarted = false;
function renderEndVideo(){
  drawScreenBackdrop();
  if(!endVideoStarted){
    endVideoStarted = true;
    try{
      endVideoEl.currentTime = 0;
      endVideoEl.style.display = 'block';
      endVideoSkipHint.style.display = 'block';
      const p = endVideoEl.play();
      if(p && p.catch) p.catch(() => {}); // autoplay may be blocked; skip hint still lets them move on
    } catch(err){
      endEndVideo(); // if video playback fails outright, don't strand the player on a blank screen
    }
  }
  if(justPressed('Enter') || endVideoEl.ended){
    endEndVideo();
  }
}
function endEndVideo(){
  endVideoStarted = false;
  try{ endVideoEl.pause(); } catch(err){}
  endVideoEl.style.display = 'none';
  endVideoSkipHint.style.display = 'none';
  state = 'credits'; creditsScrollY = 0; stateTimer = 0;
}
endVideoEl.addEventListener('click', () => { if(state === 'endVideo') endEndVideo(); });
endVideoEl.addEventListener('error', () => { if(state === 'endVideo') endEndVideo(); }); // never strand the player on a broken video

// A warm, funny credits roll — the closing capstone of the whole gift.
const CREDITS_LINES = [
  { text:'SNEAKY RAGNHEIÐUR', font:'pixel', size:20, color:'#ffcf6b', gap:60 },
  { text:'starring', size:12, color:'#8a8fa3', gap:30 },
  { text:'Ragnheiður', size:19, color:'#fff', gap:34 },
  { text:'Stuart', size:19, color:'#fff', gap:56 },
  { text:'Ragga Muffin\u2019s Interstacles ..... Himself', size:13, color:'#ffb3c1', bold:true, gap:28 },
  { text:'Jacket Reminder Services ..... A Concerned Voice', size:13, color:'#ffb3c1', bold:true, gap:28 },
  { text:'Pit-Falling Choreography ..... You, mostly', size:13, color:'#ffb3c1', bold:true, gap:28 },
  { text:'Snacks, Executive Producer of ..... TBD', size:13, color:'#ffb3c1', bold:true, gap:56 },
  { text:'Made with love, for you.', size:15, color:'#ffb3c1', bold:true, gap:34 },
  { text:'Happy Birthday, Sweetheart. \u{1F495}', size:17, color:'#ffb3c1', bold:true, gap:70 },
  { text:'press enter to return to title', size:11, color:'#6b7086', gap:0 },
];
function renderCredits(){
  drawScreenBackdrop();
  ctx.textAlign = 'center';
  let y = H - creditsScrollY;
  for(const line of CREDITS_LINES){
    if(line.text){
      const weight = line.bold ? 'bold ' : '';
      ctx.font = (line.font === 'pixel' ? line.size + 'px "Press Start 2P", monospace' : weight + line.size + 'px "Nunito", sans-serif');
      ctx.fillStyle = line.color || '#fff';
      if(line.bold){ ctx.shadowColor = '#ff8fa3'; ctx.shadowBlur = 10 + Math.sin(frameCount*0.06) * 4; }
      else { ctx.shadowBlur = 0; }
      ctx.fillText(line.text, W/2, y);
    }
    y += line.gap || 30;
  }
  ctx.shadowBlur = 0;
  creditsScrollY += 0.5; // slow, legible movie-credits pace — was 1.3, way too fast to read
  const totalHeight = CREDITS_LINES.reduce((s,l) => s + (l.gap || 30), 0);
  if(justPressed('Enter') || creditsScrollY > H + totalHeight + 60){
    state = 'title'; creditsScrollY = 0;
  }
}

function renderGameOver(){
  render_playingFrozen();
  ctx.fillStyle = 'rgba(20,5,5,0.6)';
  ctx.fillRect(0,0,W,H);
  titleText('GAME OVER', 220, 22, '#ff6b6b');
  ctx.font = '12px "Nunito", sans-serif';
  ctx.fillStyle = '#e6e9f2';
  ctx.textAlign = 'center';
  ctx.fillText('Take a breath — try this level again.', W/2, 260);
  stateTimer++;
  if(stateTimer > 30 && Math.floor(frameCount/30)%2===0){
    ctx.font = '13px "Press Start 2P", monospace';
    ctx.fillText('PRESS ENTER TO RETRY', W/2, 320);
  }
  if(stateTimer > 30 && justPressed('Enter')){
    lives = 3; hearts = maxHearts;
    loadLevel(currentLevelIndex);
    state = 'playing';
    sfx.confirm();
  }
}

function renderPaused(){
  render_playingFrozen();
  ctx.fillStyle = 'rgba(10,10,20,0.6)';
  ctx.fillRect(0,0,W,H);
  titleText('PAUSED', 220, 22, '#fff');

  const options = ['RESUME', 'MAIN MENU'];
  const startY = 300;
  options.forEach((opt, i) => {
    const active = pauseCursor === i;
    ctx.font = '14px "Press Start 2P", monospace';
    ctx.fillStyle = active ? '#ffcf6b' : '#c9cee0';
    ctx.textAlign = 'center';
    ctx.fillText((active ? '> ' : '') + opt + (active ? ' <' : ''), W/2, startY + i*42);
  });

  ctx.font = '12px "Nunito", sans-serif';
  ctx.fillStyle = '#8a8fa3';
  ctx.fillText('\u2191\u2193 to choose \u00b7 Enter to confirm \u00b7 Esc to resume', W/2, startY + options.length*42 + 18);

  if(justPressed('ArrowUp') || justPressed('ArrowDown') || justPressed('KeyW') || justPressed('KeyS')){
    pauseCursor = 1 - pauseCursor;
    sfx.select();
  }
  if(justPressed('Enter')){
    if(pauseCursor === 1){ state = 'title'; }
    else { state = 'playing'; }
    pauseCursor = 0;
    sfx.confirm();
  }
}

// Renders the game world frozen underneath overlay screens
function render_playingFrozen(){
  renderBackground(level.theme, camera.x, level.bgSeed);
  renderSolids();
  drawPickups();
  for(const en of enemies) drawEnemy(en);
  drawProjectiles();
  drawCharacter(player.x, player.y, player.w, player.h, player.facing, player.walkT, player.onGround, player.type, player.shootAnim, false, false);
  drawFallQuip();
  drawHUD();
}

// ---------- Update & render dispatch ----------
function update(dt){
  updateParticles(); // heart-shower easter egg (R + S) can fire on any screen
  if(keys['KeyR'] && keys['KeyS'] && frameCount % 2 === 0) spawnHearts(1); // keeps raining while held
  if(state === 'playing'){
    if(justPressed('Escape')){ state = 'paused'; return; }
    updatePlayer(dt);
    for(const en of enemies) updateEnemy(en, dt);
    updateProjectiles();
    checkPlayerEnemyContact();
    checkPickups();
    checkLevelProgress();
    camera.x = clamp(player.x - W/2, 0, Math.max(0, level.width - W));
  } else if(state === 'paused'){
    if(justPressed('Escape')){ state = 'playing'; }
  }
  // title, select, storyIntro, kidnap, rescue, win: menu-driven, handled inline in their render functions
}

function render(){
  frameCount++;
  if(state === 'title') renderTitle();
  else if(state === 'select') renderSelect();
  else if(state === 'kidnap') renderKidnap();
  else if(state === 'storyIntro') renderStoryIntro();
  else if(state === 'playing') render_playingFrozen();
  else if(state === 'paused') renderPaused();
  else if(state === 'levelClear') renderLevelClear();
  else if(state === 'rescue') renderRescue();
  else if(state === 'win') renderWin();
  else if(state === 'endVideo') renderEndVideo();
  else if(state === 'credits') renderCredits();
  else if(state === 'gameOver') renderGameOver();
  drawParticles(); // universal overlay so the heart shower renders over any screen
}

// ---------- Main loop ----------
let lastTs = 0;
function loop(ts){
  const dt = Math.min(ts - lastTs, 33) || 16;
  lastTs = ts;
  update(dt);
  render();
  scheduleMusic();
  clearJustPressed();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
